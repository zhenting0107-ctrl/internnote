<script type="application/json" id="seed">[{"id":"perio","name":"牙周病科","badge":"醫師習慣百科・共 40 診","sub":"主負責醫師：胡愷芳醫師｜進站班表、器械地圖與醫師習慣","secs":[{"id":"p1","title":"一、進站前與班表規則","notes":[{"id":"pn1","title":"上診班表、週三夜診與週六早診規則","tag":"進站前必做","body":"• 平時診次外，需排「週三夜診（18:00–21:00，該月第五週星期三無夜診，大家輪流排，不可一天排三診）」及「週六早診」。\n• 原則排滿 40 診即可（連假假日可不排，國定假日補假高醫牙科有上班但可不排）。\n• 進站前先寄上診班表電子檔給胡愷芳醫師，並印出紙本一份。","callout":"需準備一張「全組實習生的個人照片（臉部清晰）及對應姓名」（不用寫負責醫師）印給牙周負責醫師。","images":[],"videos":[]},{"id":"pn2","title":"進刀房班表（高機率收集 Photo 與術後 OHI）","tag":"推薦進刀房","body":"• 進刀房只是進去看刀、不用當助手（有空可幫忙補水、拿紗布），無進去次數與跟哪台刀的限制。\n• 建議先看約診日曆，列出進刀房人員、時間及執刀 VS。\n• 刀房班表需要印兩張（一張給愷芳醫師，一張給刀房護理師學姊），並傳電子檔給牙周負責醫師。","callout":"進刀房非常容易收到 Photo 與術後 OHI 的 Requirement，不用排斥進刀房！","images":[],"videos":[]}]},{"id":"p2","title":"二、開診準備與器械位置","notes":[{"id":"pn3","title":"開診前準備與診間日常","tag":"每日 SOP","body":"• 開診前：貼感控貼、開電腦、確認當診約診病人數（桌上準備好的盤子要拿之前先問學姊）。\n• 包器械：吸唾管、白管、scaling tip。\n• 補充：衛生紙、紙圍巾、杯子、手套、乾紗、棉球（剩一點點再補即可）。\n• 診間 3-way（感控貼沒在換）、high speed、low speed 一般沒在換，用完記得酒消。","callout":"牙周病科的助理學姊都超級友善，有問題趕快求救就好！","images":[],"videos":[]},{"id":"pn4","title":"隱藏版器械與刀房注意事項","tag":"器械地圖","body":"• 櫃檯區：針、麻藥、口內膏、EPT tip（EPT 盒子裡有牙膏不用四處找，tip 用完消毒拿回櫃檯）。\n• 環口勾：沒看到就是沒有了，改拿兩個單邊拉勾。\n• 拔牙器械：到科外的器械室拿，或跟學姊求救。\n• 刀房區（請診間助理學姊拿，用完也要還給學姊）：Implant driver 與 ratchet、小青蛙（小青蛙用完放到器械回收室）。\n• 不常用：植體印模套件（通常在 VS 位置前面抽屜）、Partial tray（印 study cast 要多拿一個整顎 tray）、兩把印模槍（記得拿兩種印模材 tips）、Putty（一盒大大的）。\n• 刀房幫忙：不要擋路，可幫忙裝水（八分滿）、無菌倒乾紗與針線（常用 Vicryl 5 號）到盤子上。","callout":"","images":[],"videos":[]}]},{"id":"p3","title":"三、醫師個人習慣百科","notes":[{"id":"pn5","title":"胡愷芳醫師（主負責醫師）","tag":"手套 SS","body":"• 先跟病人拿健保卡給醫師，備好 SS 號手套放在盤子上；旁邊櫃子物資相當齊全。\n• 牙周統合二階（約診病歷寫 SRP、UR、UA…）：備 syringe、麻藥（喜歡長針，不分前後牙）、有 mark 的 probe、slimtype scaling tip；洗上排牙齒燈光喜歡傾斜一點。\n• Charting：速度極快，建議上手後再跟。她會自己報牙位和方向，除了複述外不用幫核對（會亂掉）。順序 PD → CAL → Plaque，兩個 quarter 結束報 BOP；結束後拿新表複寫，BOP（紅）、Plaque（藍）要換顏色。\n• OD：小橘或小綠其中一個，要咬合紙。\n• 塗氟：氟漆一點點、小毛刷、一顆棉球。\n• Photo：極度友善，備環口勾、鏡子與兩個拉勾，她會讓病人自己拉勾，只要吹氣即可。","callout":"愷芳醫師需要 bur 時建議直接問學姊拿，不然容易多跑一趟。","images":[{"url":"images/pn5-1.jpg","cap":"環口勾（Photo 時使用）"}],"videos":[]},{"id":"pn6","title":"景勝醫師（週三早診／OHI 大師）","tag":"週三早上","body":"• 每週三早上約兩個病人，喜歡有人站在旁邊陪他。\n• 必備：牙菌斑顯示劑、棉球至少 3 顆、雙氧水（一點點）、漱口水（一點點）、mini curette（會報號碼，有很多支）。\n• Scaling tip 在口外但腳還在踩，需一直幫病人換紙圍巾（會超濕）。\n• 結束時備紙筆，他會手寫英文草寫病歷再交給學姊。","callout":"","images":[],"videos":[]},{"id":"pn7","title":"郁翔醫師 與 炯霖醫師","tag":"高頻跟診","body":"【郁翔醫師】\n• 先跟病人拿健保卡給醫師；病人到了直接請進來，圍圍巾後漱口。手套習慣自己拿，要幫他拿面罩。\n• 喜歡 WHO probe；調咬合備 normal 盤、high speed、bur 盒、咬合紙（一紅一藍）、一塊小紗。\n• OD 只用小綠；用固體樹脂時，一手拿樹脂讓他挖、一手拿小紗讓他擦。\n• Charting 新手友善、速度平靜（通常不記 Plaque）。旁邊需備口鏡，常常換。\n• 塗氟遇戴假牙者，去櫃檯拿夾鏈袋裝假牙；拆線拿白管幫忙吸著線。\n\n【炯霖醫師】\n• 自己按叫號系統；備 M 號手套放盤上；scaling 時會戴面罩（有時需幫忙拿）。\n• 愛用「斑馬 probe」，通常不 Charting，只記想記的幾顆 PD 和 BOP，寫在小紙條上並覆述即可。\n• 愛看 X 光（螢幕暗掉要幫忙動滑鼠）；很常很常塗氟（擠氟漆、備小毛刷，塗前先讓病人漱口）。\n• OD：流動樹脂、酸蝕劑、bonding 一滴、小毛刷、乾紗一個、high speed、bur，要幫忙照光（bonding 5 秒、流動樹脂 20 秒）。\n• 拆線不要動，備線剪即可；常用漱口水針筒沖洗，放在盤子上，另備一小杯漱口水。幾乎沒有 Photo。","callout":"","images":[{"url":"images/pn7-2.jpg","cap":"炯霖醫師愛用的斑馬 probe"}],"videos":[]},{"id":"pn8","title":"宗恩、官瑄、怡惠、語蓁醫師速查","tag":"細節地雷","body":"• 宗恩醫師：用 S 號手套先備好；看診速度很快；常用漱口水針筒沖洗；愛看 X 光（螢幕暗掉幫忙動滑鼠）；偶爾灌模。\n• 官瑄醫師：看診與收盤速度都要快；習慣直接讓櫃檯約診；偶爾需要 OHI；拆線不要動，他會自己拆。\n• 怡惠醫師：Charting 速度很快、不用換顏色；對跟診者能力有要求，通常是助理學姊跟；絕對不要在有怡惠醫師的區域用手機！\n• 語蓁醫師：只有禮拜二固定有診；講話清晰；需要 slimtype scaling tip 通常會自己準備在旁邊桌上。","callout":"","images":[],"videos":[]},{"id":"pn9","title":"彥鈞、筠婷醫師速查","tag":"Photo 與 Charting","body":"• 彥鈞醫師：洗牙找不到地方放白管就不用勉強（病人會自己吐到吸唾管）；用 S 號手套會自己拿；病人不多、一個病人看很久，常有 Photo 與 OHI；拆線不要動。\n• 筠婷醫師：學姊很友善；很多 Photo 與 Charting，Photo 拉勾的部分學姊有自己的要求，放好鏡子就可以直接吹氣。Charting 需記 Furcation（1 記 ∧、2 記 △、3 記 ▲），數字、BOP（紅）、Plaque（藍）皆需換顏色。","callout":"衛教 OHI 可以多跟彥鈞、郁翔或炯霖醫師，很多機會可以集 Requirements！","images":[],"videos":[]}]},{"id":"p4","title":"四、Requirements 與報告繳交","notes":[{"id":"pn10","title":"實習日誌、護照審核與 Requirements","tag":"每週五截止","body":"• 實習日誌：一週兩張（每週五一次交兩張），最晚禮拜四寫好，禮拜五先給胡愷芳醫師簽名，再準時交到詠愷老師那邊。\n• 護照系統：Requirements 統一掛「960262 胡愷芳」審核。\n• Charting 與 PGY 的 Data Collection 最多。\n• 術後衛教：緊盯手術病人動態，或先與跟刀 intern 說要衛教；櫃檯有衛教單。\n• 灌模：不要拆爆、不要 bubble、不要 undercut，不太會可請教助理學姊。","callout":"","images":[],"videos":[]},{"id":"pn11","title":"晨會報告、個人報告與詠愷老師","tag":"報告","body":"• 晨會報告：除了晨會報，還要在科內報過一次（跟主 cover 醫師說）；要提前跟負責醫師說需要 Case，不然醫師不會記得；提早約詠愷老師討論修改。\n• 個人報告：寫老師雲端裡的 SOAP 即可（不用做 PPT），找一個有跟診、有 OHI、有問問卷的病歷；問問卷前先問醫師可不可以，不要在病人面前問。","callout":"詠愷老師提醒：有任何問題都直接在群組問，不要私訊，老師會搞混！","images":[],"videos":[]}]}]},{"id":"os","name":"口腔顎面外科","badge":"區域分流・實作示範影片","sub":"治療區（櫃檯／手術／一般診椅）＋門診區＋週二上午中供室","secs":[{"id":"o1","title":"一、進站前與早上 8:10 必做","notes":[{"id":"on1","title":"進站前班表與早上 8:10 開診準備","tag":"8:10 動起來","body":"• 進站前一週做好班表，繳交兩份紙本（一份給科秘書、一份給總醫師／櫃檯學姊），並提前來口外詢問該月門診總醫師是哪位，約 Orientation。\n• 門診區 8:10 動起來：準備 10 盤拆線盤（Normal 盤＋線剪＋2 個 GI 棉球＋2 個 H2O2 棉球）與無菌鑷罐到 7 號治療椅；早上先換掉感控貼（一整天只換那一次）。\n• 手術區：幫忙學姊補好器械（她早上會去推）、放無菌鑷罐。","callout":"GI 與 H2O2 棉球必須用「兩個不同 Normal 盤的鑷子」分開夾，並放在盤子兩個角落，混到會讓 GI 褪色！","images":[],"videos":["備拆線盤 | https://youtube.com/shorts/ou79t-1jP1k"]}]},{"id":"o2","title":"二、櫃檯區流程與白板書寫","notes":[{"id":"on2","title":"接單、電子同意書與量血壓流程","tag":"櫃檯核心","body":"• 診次代碼：1331（一診）、1332（二診）、1333（三診）、1338（約診）；切換診次要回到情境約診；沒看到同意書可改「三十天內」，都沒有就是還沒開，跟學姊說或再等一下。\n• 拔牙：局部麻醉＋拔牙同意書。切片／雷射：局部麻醉＋切片／雷射同意書＋術前紀錄（傷口拍攝）同意書。有自費材料或診斷證明書才需簽自費同意書。\n• 流程：多元叫號 → 確認姓名、手術項目、牙位 → 在 pano／切片單空白處簽名 → 簽電子同意書（核對身分證字號、地址、電話；代簽要改成簽名本人）→ 量血壓 → 請病人坐藍色椅子等（太多人就請在外面稍等）。\n• 約診（1338）：病人會拿約診單來櫃檯，收約診單和健保卡請他在外面稍等。\n• Taking 是 new pa 給 intern 先看；S/R 是拆線。","callout":"確認有空治療椅並問過護理學姊後：可進去就「寫白板」，把 OP mark 拿進刀房（手繪單與資料夾放櫃檯後左邊）；沒空位就把整份資料夾連同 OP mark 放櫃檯後右邊依序排隊。","images":[],"videos":[]},{"id":"on3","title":"白板書寫規範（去識別化）","tag":"務必擦掉","body":"• 畫筆顏色：一診、約診用藍筆；二診、三診用黑筆。\n• 內容：血壓／心律（紅筆寫最上方）、病人姓名去識別（如：王O明）、牙位十字圖＋代詞、術者／主治（都是 VS 就寫 VS）。\n• 代詞：拔牙 ext、切片 Biopsy、雷射 CO2 Laser。","callout":"手術結束後，白板上的病人資料「記得一定要立刻擦掉」（非常重要）！","images":[],"videos":[]}]},{"id":"o3","title":"三、門診手術區備物與示範影片","notes":[{"id":"on4","title":"拔牙 (Impaction 包) vs 切片／雷射 (Biopsy 包) 備物","tag":"實作示範區","body":"• 手術包：拔牙拿 Impaction 包（14 支）；切片／雷射拿 Biopsy 包（11 支）。外面兩層直接用手開，開完戴無菌手套備物。\n• 用無菌夾夾取：麻藥（一般 2 管、單顆智齒 3 管、上下顎智齒 4 管；切片／雷射 2 管；心臟疾病相關才用藍麻）、針頭（上顎、切片全拿短針；下顎 35／45 以後拿長針）、空針針頭、鋼杯（先裝生理食鹽水）。\n• 撕開倒入無菌區：小乾紗（全下）、20mL 空針筒（每個包都要一個）、Suction 管。\n• 拔牙若需 Striker（直機）：先問學長姐，再下 Striker、布套與 Bur。\n• 雷射：不在四號位要推機器過來插電，鑰匙向右轉開機。","callout":"拿這個櫃檯的東西「絕對不能帶著手套拿」！無菌夾也不可以去夾小罐子裡泡著的棉球。","images":[],"videos":["Level 1. 備包 | https://youtu.be/4TTELkmXLfU","Level 2. 戴手套備包 | https://youtu.be/LBWPe9Mc2k0","裝麻醉 | https://youtube.com/shorts/kSJ0yR2SKRs"]},{"id":"on5","title":"跟診步驟、器械辨識與機器消毒","tag":"刀房實戰","body":"• 流程：板夾夾 pano／切片單 → 拿包備物（可同時另一人帶病人進來）→ 確認姓名、手術、牙位 → 口內消毒用 BI（1 支大棉棒），口外用克菌寧（2 支大棉棒）→ 蓋洞巾、放 Suction 管（兩件事前都先跟病人說明）→ 通知 intern／R／VS。\n• 打麻藥：拔牙一般由 intern 打；VS 有在單子上寫要親自打才通知 VS；沒有 intern 可打且 R 有空才通知 R；biopsy 由術者打。\n• 器械辨識：Elevator 分直／彎、細／中／寬（超常用），「鶴嘴」不是 Elevator！\n• 雷射用完：機頭與面板用「不同張酒精棉片」消毒，機頭擦不乾淨跟學姊說。\n• 小相機：切片或雷射消毒前，先拍「病歷號及姓名」再拍「病灶」，拍完給學姊與總醫師檢查。\n• 結束：帶病人去藍色椅子坐，把板夾上的單子給櫃檯衛教，擦掉白板。","callout":"小心不要打翻生理食鹽水（會被念），也不要隨便消失，離開要先跟學姊或組員報備。","images":[],"videos":["鋪巾、接 Suction tube | https://youtu.be/EgdN4NJHymM","收包 | https://youtu.be/RUaGlqsvky8","裝／卸刀片 | https://youtube.com/shorts/QfJmmWoV5LU","接 Strike | https://youtube.com/shorts/P3Db6lUhIPs"]},{"id":"on6","title":"門診區協助與病人常見狀況","tag":"門診區","body":"• 幫忙請病人進來；new pa 學姊會請你先問主要看診目的並回報，需要先拍 pano 就指引去牙科 X 光室，拍完到手術區外等叫號（不用進櫃檯問）。\n• 拆線病人一樣到手術區外等叫號；需開診斷書者看診後請簽自費同意書；要拔牙或切片／雷射的病人，負責運送 OP mark 到櫃檯。\n• 病人消毒完又摸臉：消毒前就說明，摸了要再消一次。很冷或發抖：蓋防護衣；沒吃飯就來要跟學姊說（可能要量血壓），也可能是麻醉劑導致，跟學姊或 R 說。\n• 先看 OP mark 猜需要的器械、針頭、幾管麻藥、要不要 Striker，先準備好可減少被噴，但拿錯還下下去照樣噴。\n• 叫病人用多元叫，按兩三次沒出現再出去找；病人一直問就說現在沒人可處理請繼續等。","callout":"VS 都有 intern 跟診，我們幾乎不用跟；他們都沒空才會要我們上手套，不要擋視線、好好吸血水就好。","images":[],"videos":[]}]},{"id":"o4","title":"四、術後衛教與結帳單據","notes":[{"id":"on7","title":"術後衛教重點與單據歸檔","tag":"別讓病人久等","body":"• 咬紗布：確實咬緊 1 小時，能不說話就不說話，口水吞下去不要吐出來。\n• 冰熱敷：冰敷 30 分鐘休 30 分鐘；一天後若還有腫痛改熱敷（不燙手程度，一天 2–4 次）；睡覺勿壓手術側。\n• 清潔：第一天先不要刷手術區，一天後可正常刷但不要過度用力；勿一直吐口水、漱口以免血塊脫落；一天內少量滲血屬正常。\n• 用藥：抗生素要確實吃完，止痛藥痛再吃。有問題可打口外分機 7001。\n• 櫃檯有衛教單張（有英文版，在一般衛教單張下面）；有家屬陪同請一起聽（尤其長者）。\n• 結帳：確認有無縫傷口，沒縫且無下次處理可幫忙取消掛號；給病人健保卡、下次掛號單（不用回診就不給）和繳費單；繳費單 200 元以上需確認自費同意書。\n• 歸檔：手繪單與 OP mark 釘在一起放進櫃檯「粉紅色籃子」；沒有手繪單就到電腦按病患旁三個點 → QR code → 手繪門診單。","callout":"一定要緊盯有沒有病人從刀房出來，不能讓病人在藍色椅子上等很～久！","images":[],"videos":[]}]},{"id":"o5","title":"五、報告規定與週二中供室","notes":[{"id":"on8","title":"許瀚仁老師報告規定 & 進刀房刷卡","tag":"作業審核","body":"• Requirements 與報告都找許瀚仁老師審核；口篩就是協助 taking。\n• 個人報告：個案報告和照護計劃，挑想看的手術。團體報告：個人內容加疾病討論（可加照護討論），要看指標性手術（口腔癌、正顎）。格式為簡報；全組個人與團體報告都做完才由組長用 LINE 一次上傳。\n• 需提前找該刀負責 VS 的 intern，約「術前查房與洗牙」及「術後查房」（常在晚上八九點後，要體諒 intern）。\n• 進刀房更衣室需刷卡，提前找同性別 intern 帶進去（男生入口在三講那邊、女生在舊棟牙周那邊）。","callout":"報告規定可能更動，建議再向瀚仁老師確認。","images":[],"videos":[]},{"id":"on9","title":"週二上午：中央供應室（中供室）","tag":"週二 7:55 集合","body":"• 每週二上午診在供應室，7:55 前準時集合點名，實習服與識別證都要穿上別上。\n• 12:00 前完成個人護照簽到，送審寫「中央供應組 邱月琴」阿長（很快就會審核）。\n• 學姊講完課後有許多自己的時間，可用來寫心得；每週寫一份當天學習心得（通常 11 點輪流去電腦區寫）。\n• 最後一週每人交一份總結個人心得，印成紙本交給阿長。","callout":"","images":[],"videos":["中供室怎麼去 | https://youtube.com/shorts/5cTtAReJLR4"]}]}]},{"id":"ep","name":"保存與補綴科","badge":"系統路徑・審核歸屬","sub":"牙髓病科（宋淑靜醫師）＆ 補綴科（黃佳旭醫師）","secs":[{"id":"e1","title":"一、負責醫師與行前 Orientation","notes":[{"id":"en1","title":"負責醫師聯絡與 TMS+ 系統路徑","tag":"進站前必看","body":"• 115/9～116/5 期間實習負責醫師：\n  - 牙髓病科：宋淑靜醫師\n  - 補綴科：黃佳旭醫師\n• 進站前先到高醫體系員工學習管理系統（TMS+）查看兩位醫師的說明，裡面有負責醫師聯絡方式，提前跟醫師約時間 Orientation。\n• 兩個科別的 Orientation 都超級詳細，因此交接簡報沒有特別說明科內器械與醫師習慣；牙髓與補綴會直接安排每天跟哪位住院醫師（R）。","callout":"系統路徑：個人專區 → e-Learning（院外）→ TMS+ 課程中心 → 課程編號 85373「115學年度口衛系實習生 實習注意事項」→ 查看「補綴-115學年度補綴科口衛系」與「保存-實習需知-口衛系-2026」。","images":[{"url":"images/en1-3.jpg","cap":"步驟 1：個人專區 → e-Learning（院外）"},{"url":"images/en1-4.jpg","cap":"步驟 2：課程中心，找到課程編號 85373"},{"url":"images/en1-5.jpg","cap":"步驟 3：課程內容，查看補綴與保存的說明檔"}],"videos":[]}]},{"id":"e2","title":"二、Requirements 審核歸屬","notes":[{"id":"en2","title":"牙髓 vs 補綴 護照送審對象","tag":"別掛錯醫師","body":"• 牙髓病科：\n  - Endo 與 OD 跟診：可掛當時跟診的住院醫師（R）審核；不知道名字的話，直接掛「宋淑靜醫師」也可以。\n  - 其餘所有項目：一律直接掛「宋淑靜醫師」審核。\n• 補綴科：\n  - 跟診項目：掛當時跟的那位住院醫師（R）；只有真正跟黃佳旭醫師的診，才可以掛佳旭醫師。\n  - 其他操作項目（如灌模、調 Cement 等）：一律掛「黃佳旭醫師」審核。","callout":"","images":[],"videos":[]}]},{"id":"e3","title":"三、個案報告與作業規定","notes":[{"id":"en3","title":"坤宗醫師作業與口頭簡報","tag":"手寫＋簡報","body":"• 指導醫師：坤宗醫師（實習手冊中附件 7）。\n• 每週一份「手寫」個案報告，共四份：牙髓兩份、補綴兩份。\n• 從四份個案報告中，牙髓與補綴「各挑一份」做成簡報，跟坤宗醫師約時間報告（找前一組同學加入群組，一起跟老師約）。","callout":"","images":[],"videos":[]}]}]}]</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let D=JSON.parse($("#seed").textContent),view=location.hash.slice(1)||"home",edit=false,art=null,assets=null,draft=[];
try{edit=sessionStorage.getItem("edit")==="1"}catch(e){}
const S=i=>D.find(x=>x.id===i),C=(s,c)=>S(s).secs.find(x=>x.id===c),N=(s,c,n)=>C(s,c).notes.find(x=>x.id===n);
function toast(m){const t=$("#toast");t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2400)}
const GH=()=>{try{return JSON.parse(localStorage.getItem("gh"))}catch(e){return null}};
async function ghPut(path,b64,msg){const g=GH(),u=`https://api.github.com/repos/${g.repo}/contents/${path}`,H={Authorization:"Bearer "+g.token,Accept:"application/vnd.github+json"};
for(let i=0;i<3;i++){let sha;/* 每次寫入前即時抓最新 sha：no-store + ?t= 時間戳記，避免讀到快取的舊 sha */
const r=await fetch(u+"?ref="+encodeURIComponent(g.branch)+"&t="+Date.now(),{headers:H,cache:"no-store"});
if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)throw new Error("讀取最新版本失敗 "+r.status);
const p=await fetch(u,{method:"PUT",headers:H,cache:"no-store",body:JSON.stringify({message:msg,content:b64,branch:g.branch,sha})});
if(p.ok)return;if((p.status!==409&&p.status!==422)||i===2)throw new Error("寫入失敗 "+p.status)}}
let tm,busy=Promise.resolve();function save(){clearTimeout(tm);tm=setTimeout(()=>{busy=busy.then(async()=>{if(!GH())return toast("請先設定 GitHub");try{await ghPut("data.json",btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1)))),"update notes");toast("已儲存到 GitHub，約 1 分鐘後生效")}catch(e){toast("儲存失敗："+e.message)}})},800)}
function ghForm(){const g=GH()||{};modal("GitHub 設定",fld("g1","儲存庫（帳號/儲存庫名稱）",g.repo)+fld("g2","分支",g.branch||"main")+fld("g3","Personal Access Token",g.token)+'<p class="mu">Token 只存在這支手機或電腦的瀏覽器，請用只授權這個儲存庫、權限為 Contents 讀寫的 fine-grained token。</p>',()=>{if(!val("g1")||!val("g3"))return false;localStorage.setItem("gh",JSON.stringify({repo:val("g1"),branch:val("g2")||"main",token:val("g3")}));toast("已儲存設定");render()})}
function go(id){view=id;location.hash=id==="home"?"":id;$("#q").value="";render();scrollTo(0,0)}
addEventListener("hashchange",()=>{view=location.hash.slice(1)||"home";render()});
const adm=h=>edit?`<span class="adm">${h}</span>`:"";
const bt=(l,f,c="")=>`<button class="b ${c}" onclick="${f}">${l}</button>`;
function modal(title,body,ok,lab="儲存"){const m=$("#modal");m.innerHTML=`<div class="mb"><h3>${title}</h3>${body}<div class="row end"><button class="b" onclick="closeM()">取消</button><button class="b p" id="ok">${lab}</button></div></div>`;m.hidden=false;$("#ok").onclick=()=>{if(ok()!==false)closeM()}}
const closeM=()=>{$("#modal").hidden=true};
const fld=(id,l,v,a)=>`<label>${l}</label>${a?`<textarea id="${id}" rows="${a}">${esc(v)}</textarea>`:`<input id="${id}" value="${esc(v)}">`}`;
const val=id=>$("#"+id).value.trim();
function sure(msg,f){modal("請確認",`<p>${esc(msg)}</p>`,()=>{f();save();render()},"確定刪除")}
function nav(){$("#nav").innerHTML=[`<button class="t ${view==="home"?"on":""}" onclick="go('home')">📒 首頁</button>`].concat(D.map(s=>`<button class="t ${view===s.id?"on":""}" onclick="go('${s.id}')">${esc(s.name)}</button>`)).join("")+(edit?bt("＋ 新增科別","stForm()"):"")}
function stick(t){return `<div class="st"><b>📌 筆記便利貼：</b>${esc(t)}</div>`}
function card(s,c,n){
 if(n.sticky)return `<div class="note">${stick(n.callout)}${adm(mv(s,c,n.id)+bt("編輯",`stkForm('${s}','${c}','${n.id}')`)+bt("刪除",`delNote('${s}','${c}','${n.id}')`,"d"))}</div>`;
 const ls=(n.callout||"").split("\n").filter(x=>x.trim());
 const im=(n.images||[]).map(i=>`<figure><img src="${esc(i.url)}" alt="${esc(i.cap)}" loading="lazy" onclick="zoom(this.src)"><figcaption>${esc(i.cap)}</figcaption></figure>`).join("");
 const vd=(n.videos||[]).map(v=>{const p=v.split("|").map(x=>x.trim()),u=p.find(x=>/^https?:/.test(x));return u?`<a class="vid" target="_blank" rel="noopener noreferrer" href="${esc(u)}">▶ ${esc(p[0]===u?"示範影片":p[0])}</a>`:""}).join("");
 return `<article class="note"><div class="nh"><h3>${esc(n.title)}</h3><span>${n.tag?`<span class="tag">${esc(n.tag)}</span> `:""}${adm(mv(s,c,n.id)+bt("編輯",`noteForm('${s}','${c}','${n.id}')`)+bt("刪除",`delNote('${s}','${c}','${n.id}')`,"d"))}</span></div><div class="body">${esc(n.body)}</div>${ls.map(stick).join("")}${im}<div>${vd}</div></article>`}
function home(){return `<div class="grid">${edit?'<div class="card" onclick="stForm()" style="border-style:dashed;text-align:center"><h2>＋ 新增科別</h2><p class="mu">建立新的實習站別</p></div>':""}${D.map(s=>`<div class="card" onclick="go('${s.id}')"><span class="tag">${esc(s.badge)}</span><h2 style="margin:8px 0">${esc(s.name)}</h2><p class="mu">${esc(s.sub)}</p>${adm(`<span onclick="event.stopPropagation()">${bt("←",`mvSt('${s.id}',-1)`)}${bt("→",`mvSt('${s.id}',1)`)}${bt("置頂",`topSt('${s.id}')`)}${bt("編輯",`stForm('${s.id}')`)}${bt("刪除",`delSt('${s.id}')`,"d")}</span>`)}</div>`).join("")}</div>`}
function page(s){return `<div style="margin-top:14px"><span class="tag">${esc(s.badge)}</span><h2 style="font-size:26px">${esc(s.name)}</h2><p class="mu">${esc(s.sub)}</p>${adm(bt("←",`mvSt('${s.id}',-1)`)+bt("→",`mvSt('${s.id}',1)`)+bt("置頂",`topSt('${s.id}')`)+bt("編輯科別",`stForm('${s.id}')`)+bt("＋ 新增子分類",`secForm('${s.id}')`))}</div><div class="pills">${s.secs.map(c=>`<button class="pill" onclick="document.getElementById('${c.id}').scrollIntoView({behavior:'smooth'})">${esc(c.title)}</button>`).join("")}</div>`+s.secs.map(c=>`<section id="${c.id}"><div class="sh"><h2 style="font-size:20px">${esc(c.title)}</h2>${adm(bt("↑",`mvSec('${s.id}','${c.id}',-1)`)+bt("↓",`mvSec('${s.id}','${c.id}',1)`)+bt("＋ 筆記",`noteForm('${s.id}','${c.id}')`)+bt("＋ 便利貼",`stkForm('${s.id}','${c.id}')`)+bt("改名",`secForm('${s.id}','${c.id}')`)+bt("刪除分類",`delSec('${s.id}','${c.id}')`,"d"))}</div>${c.notes.length?c.notes.map(n=>card(s.id,c.id,n)).join(""):`<p class="mu">尚無筆記。</p>`}</section>`).join("")}
function hl(root,q){const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(t=>{if(t.parentNode.closest("button"))return;const p=t.nodeValue.split(re);if(p.length<2)return;const f=document.createDocumentFragment();p.forEach((x,i)=>{if(!x)return;if(i%2){const k=document.createElement("mark");k.textContent=x;f.append(k)}else f.append(x)});t.parentNode.replaceChild(f,t)})}
function hits(q){let h="",k=0;D.forEach(s=>s.secs.forEach(c=>c.notes.forEach(n=>{if([s.name,c.title,n.title,n.tag,n.body,n.callout].join(" ").toLowerCase().includes(q)){k++;h+=`<p class="mu">📍 ${esc(s.name)} ＞ ${esc(c.title)}</p>`+card(s.id,c.id,n)}})));return k?`<p class="mu">找到 ${k} 筆</p>`+h:`<p class="mu">找不到相關筆記。</p>`}
function render(){nav();$("#ed").innerHTML=bt(edit?"🔓 退出編輯":"✏️ 編輯模式","tog()",edit?"p":"")+(edit?bt("⚙️ 設定","ghForm()"):"");const q=$("#q").value.trim().toLowerCase(),a=$("#app");if(q){a.innerHTML=hits(q);hl(a,q);return}if(view==="home")return a.innerHTML=home();const s=S(view);if(!s){go("home");return}a.innerHTML=page(s)}
let canEditUI=false;
function tog(){if(!GH()){ghForm();return}edit=!edit;try{sessionStorage.setItem("edit",edit?"1":"0")}catch(e){}render()}
function zoom(u){const l=$("#lb");l.querySelector("img").src=u;l.style.display="flex"}
function stForm(id){const s=id&&S(id);modal(id?"編輯科別":"新增科別",fld("f1","科別名稱 *",s&&s.name)+fld("f2","貼紙標籤",s&&s.badge)+fld("f3","副標題",s&&s.sub),()=>{if(!val("f1"))return false;if(s){s.name=val("f1");s.badge=val("f2");s.sub=val("f3")}else{const n={id:"s"+Date.now(),name:val("f1"),badge:val("f2"),sub:val("f3"),secs:[{id:"c"+Date.now(),title:"一、進站前與基本規則",notes:[]}]};D.push(n);view=n.id;location.hash=n.id}save();render()})}
function secForm(s,c){const x=c&&C(s,c);modal(c?"子分類改名":"新增子分類",fld("f1","標題 *",x&&x.title),()=>{if(!val("f1"))return false;if(x)x.title=val("f1");else S(s).secs.push({id:"c"+Date.now(),title:val("f1"),notes:[]});save();render()})}
function stkForm(s,c,n){const x=n&&N(s,c,n);modal("便利貼",fld("f1","內容 *",x&&x.callout,3),()=>{if(!val("f1"))return false;if(x)x.callout=val("f1");else C(s,c).notes.push({id:"n"+Date.now(),sticky:true,title:"便利貼",callout:val("f1")});save();render()})}
function noteForm(s,c,n){const x=n&&N(s,c,n);draft=x?(x.images||[]).map(i=>({...i})):[];
 modal(n?"編輯筆記":"新增筆記",fld("f1","標題 *",x&&x.title)+fld("f2","右上角標籤",x&&x.tag)+fld("f3","文字內容 *",x&&x.body,6)+fld("f4","便利貼（每行一個框）",x&&x.callout,3)+`<label>照片</label><input type="file" id="pf" accept="image/*" multiple  onchange="addPh(this.files)"><div id="pl"></div>`+fld("f5","影片（每行：標題 | 網址）",x&&(x.videos||[]).join("\n"),3),()=>{if(!val("f1")||!val("f3"))return false;const o={id:x?x.id:"n"+Date.now(),title:val("f1"),tag:val("f2"),body:$("#f3").value.trim(),callout:$("#f4").value.trim(),images:draft,videos:$("#f5").value.split("\n").map(v=>v.trim()).filter(Boolean)};const L=C(s,c).notes;if(x)L[L.indexOf(x)]=o;else L.push(o);save();render()});drawPh()}
function drawPh(){$("#pl").innerHTML=draft.map((p,i)=>`<div class="ph"><img src="${esc(p.url)}" alt=""><input value="${esc(p.cap)}" oninput="draft[${i}].cap=this.value"><button class="b d" onclick="draft.splice(${i},1);drawPh()">✕</button></div>`).join("")}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(r,"image/jpeg",.8)};i.src=URL.createObjectURL(f)})}
async function addPh(fs){for(const f of fs){try{const b=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)});const n="images/"+Date.now()+"-"+f.name.replace(/[^\w.]/g,"_");await ghPut(n,b,"add photo");draft.push({url:n,cap:f.name.replace(/\.\w+$/,"")})}catch(e){toast("上傳失敗："+e.message)}}drawPh();toast("照片已上傳，約 1 分鐘後才看得到")}
function mvSt(i,d){const a=D.findIndex(x=>x.id===i),b=a+d;if(b<0||b>=D.length)return;[D[a],D[b]]=[D[b],D[a]];save();render()}
function topSt(i){const a=D.findIndex(x=>x.id===i);if(a<1)return;D.unshift(D.splice(a,1)[0]);save();render()}
function mvSec(s,c,d){const L=S(s).secs,i=L.indexOf(C(s,c)),j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];save();render()}
function mvNote(s,c,n,d){const L=C(s,c).notes,i=L.indexOf(N(s,c,n)),j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];save();render()}
function mvTo(s,c,n){const o=[];D.forEach(st=>st.secs.forEach(x=>o.push(`<option value="${st.id}|${x.id}">${esc(st.name)}／${esc(x.title)}</option>`)));modal("移到其他子分類",`<select id="mt" style="width:100%;padding:10px;font-size:16px">${o.join("")}</select>`,()=>{const[a,b]=$("#mt").value.split("|"),L=C(s,c).notes,x=L.splice(L.indexOf(N(s,c,n)),1)[0];C(a,b).notes.push(x);save();render()},"移動")}
const mv=(s,c,n)=>bt("↑",`mvNote('${s}','${c}','${n}',-1)`)+bt("↓",`mvNote('${s}','${c}','${n}',1)`)+bt("搬到…",`mvTo('${s}','${c}','${n}')`);
const delNote=(s,c,n)=>sure("確定刪除這則筆記？",()=>{const L=C(s,c).notes;L.splice(L.indexOf(N(s,c,n)),1)});
const delSec=(s,c)=>sure("確定刪除此分類與其中所有筆記？",()=>{const L=S(s).secs;L.splice(L.indexOf(C(s,c)),1)});
const delSt=s=>sure("確定刪除此科別與其中所有內容？",()=>{D.splice(D.indexOf(S(s)),1)});
render();
fetch("data.json?"+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(j=>{D=j;render()}).catch(()=>{});
</script></body></html>
